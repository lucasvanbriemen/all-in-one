# Primary database: the existing email project's MySQL/MariaDB database,
# accessed through the trilogy adapter. Connection details come from the
# environment (see .env for local development); they mirror the old Laravel
# project's DB_* variables.
#
# The pool has to cover the widest thread count in any single process. The job
# worker runs IMAP_FETCH_CONCURRENCY threads (see config/queue.yml), which is
# far above RAILS_MAX_THREADS, so sizing on that alone would starve fetches of
# connections and undo the parallelism.
<% db_pool = [ ENV.fetch("RAILS_MAX_THREADS", 3).to_i, ENV.fetch("IMAP_FETCH_CONCURRENCY", 20).to_i ].max + 5 %>
default: &default
  adapter: trilogy
  encoding: utf8mb4
  pool: <%= ENV.fetch("DB_POOL") { db_pool } %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 3306) %>
  username: <%= ENV.fetch("DB_USERNAME", "root") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

# Secondary database: the music project's, reached through
# Music::ApplicationRecord while that app is being rewritten into this one.
#
# It sits on the same MySQL instance as the email database — ltvb.nl,
# server.ltvb.nl and lucasvanbriemen.nl all resolve to the same server — so in
# practice only the database name differs. The MUSIC_DB_* overrides are here
# for the day that stops being true.
#
# Two deliberate choices:
#
#   * A pool of its own, sized on web threads instead of on
#     IMAP_FETCH_CONCURRENCY. Nothing in the job worker touches music, so
#     inheriting the primary's pool would double this process's connection
#     count against the shared server to no purpose.
#   * database_tasks: false outside of test (below). The music app still owns
#     this schema; here it is only consumed. Without that flag, `db:migrate`
#     or `db:prepare` in this app would try to migrate another app's
#     database. db/music_schema.rb is consequently a copy of the music
#     project's db/schema.rb — refresh it when that one changes — and not
#     something this app dumps.
#
# migrations_paths exists for the same reason: a secondary database without it
# falls back to db/migrate, which would point this app's email migrations at
# the music database wherever tasks do run (i.e. test).
music_default: &music_default
  <<: *default
  pool: <%= ENV.fetch("MUSIC_DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 3).to_i + 2 } %>
  host: <%= ENV.fetch("MUSIC_DB_HOST") { ENV.fetch("DB_HOST", "127.0.0.1") } %>
  port: <%= ENV.fetch("MUSIC_DB_PORT") { ENV.fetch("DB_PORT", 3306) } %>
  username: <%= ENV.fetch("MUSIC_DB_USERNAME") { ENV.fetch("DB_USERNAME", "root") } %>
  password: <%= ENV.fetch("MUSIC_DB_PASSWORD") { ENV.fetch("DB_PASSWORD", "") } %>
  migrations_paths: db/music_migrate

# Solid Cache/Queue/Cable keep their own local SQLite stores so they do not
# add framework tables to the shared email database.
sqlite_default: &sqlite_default
  adapter: sqlite3
  pool: <%= ENV.fetch("DB_POOL") { db_pool } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_DATABASE", "email") %>
  music:
    <<: *music_default
    database: <%= ENV.fetch("MUSIC_DB_DATABASE", "music") %>
    database_tasks: false

# Warning: Rails erases and regenerates the "test" databases, so neither may
# point at live data. The music one also has to stay clear of `music_test`,
# which is the database the music project's own suite erases.
test:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_DATABASE_TEST", "email_test") %>
  music:
    <<: *music_default
    database: <%= ENV.fetch("MUSIC_DB_DATABASE_TEST", "all_in_one_music_test") %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_DATABASE", "email") %>
  music:
    <<: *music_default
    database: <%= ENV.fetch("MUSIC_DB_DATABASE", "music") %>
    database_tasks: false
  cache:
    <<: *sqlite_default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *sqlite_default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *sqlite_default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
